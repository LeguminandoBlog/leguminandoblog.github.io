<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preferiti | Leguminando</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Georgia', serif;
    background: #f8f5f0;
    min-height: 100vh;
    padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }

.header {
    background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    color: white;
    padding: 40px 20px 30px;
    text-align: center;
    border-radius: 20px;
    margin-bottom: 30px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
.header .tagline { font-size: 1.2em; opacity: 0.9; font-style: italic; }

.back-link {
    display: inline-block;
    margin: 20px 0;
    padding: 10px 20px;
    background: #8B4513;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.95em;
    transition: background 0.3s;
}
.back-link:hover { background: #D2691E; }

.favorites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}
.fav-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: transform 0.3s;
    display: flex;
    flex-direction: column;
}
.fav-card:hover { transform: translateY(-5px); }
.fav-card .fav-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}
.fav-card .fav-body {
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
}
.fav-card .fav-icon { font-size: 1.8em; flex-shrink: 0; }
.fav-card .fav-info { flex: 1; min-width: 0; }
.fav-card .fav-title { font-size: 1.05em; font-weight: bold; color: #8B4513; margin-bottom: 4px; }
.fav-card .fav-path { font-size: 0.8em; color: #666; }
.fav-card .fav-link { color: #D2691E; text-decoration: none; font-weight: bold; }
.fav-card .fav-link:hover { text-decoration: underline; }
.remove-btn {
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 1.2em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
    flex-shrink: 0;
}
.remove-btn:hover { background: #c0392b; }

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #666;
}
.empty-state .big-icon { font-size: 4em; margin-bottom: 20px; }
.empty-state h2 { color: #8B4513; margin-bottom: 15px; font-size: 1.8em; }
.empty-state p { font-size: 1.1em; line-height: 1.6; }

.footer {
    text-align: center;
    margin-top: 50px;
    padding: 20px;
    color: #8B4513;
    font-size: 0.9em;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>❤️ Preferiti</h1>
<p class="tagline">Le tue ricette preferite in un unico posto</p>
</div>

<a href="index.html" class="back-link">← Torna alla Home</a>

<div id="favorites-container">
<!-- Popolato da JavaScript -->
</div>

<div class="footer">
<p>🫘 Leguminando - Ricette di stagione a base di legumi</p>
<p>"Tutto è iniziato con hummus di ceci..."</p>
</div>
</div>

<script>
function renderFavorites() {
    const container = document.getElementById('favorites-container');
    const favs = JSON.parse(localStorage.getItem('leguminando_favs') || '{}');
    const paths = Object.keys(favs);
    
    if (paths.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="big-icon">🤍</div>
                <h2>Nessun preferito ancora</h2>
                <p>Clicca sul cuoricino 🤍 nelle ricette per aggiungerle ai preferiti.<br>Le troverai tutte qui! 🫘</p>
            </div>
        `;
        return;
    }
    
    let html = '<div class="favorites-grid">';
    paths.forEach(path => {
        const title = favs[path];
        const season = path.split('/')[0];
        // Deriva l'immagine: estate/049.html → estate/049.jpg
        const imgPath = path.replace(/\.html$/, '.jpg');
        html += `
            <a href="${path}" class="fav-card" style="text-decoration:none;color:inherit;">
                <img src="${imgPath}" alt="${title}" class="fav-img" onerror="this.style.display='none'">
                <div class="fav-body">
                    <div class="fav-icon">❤️</div>
                    <div class="fav-info">
                        <div class="fav-title">${title}</div>
                        <div class="fav-path">📂 ${season}</div>
                    </div>
                    <button class="remove-btn" onclick="event.preventDefault(); event.stopPropagation(); removeFav('${path}')" title="Rimuovi dai preferiti">×</button>
                </div>
            </a>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
}

function removeFav(path) {
    let favs = JSON.parse(localStorage.getItem('leguminando_favs') || '{}');
    delete favs[path];
    localStorage.setItem('leguminando_favs', JSON.stringify(favs));
    renderFavorites();
}

document.addEventListener('DOMContentLoaded', renderFavorites);
</script>
</body>
</html>

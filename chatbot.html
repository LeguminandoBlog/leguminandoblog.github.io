<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegumAI | Leguminando</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f8f5f0; min-height: 100vh; }

  .top-bar {
    background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #F4A460 100%);
    color: white; text-align: center; padding: 20px;
  }
  .top-bar h1 { font-size: 2em; }
  .top-bar a { color: white; text-decoration: underline; }

  .chat-wrap {
    max-width: 700px; margin: 30px auto; padding: 0 16px;
  }

  .chat-card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex; flex-direction: column;
    height: calc(100vh - 160px); min-height: 500px;
    overflow: hidden;
  }

  .chat-header {
    background: #2d5016; color: #fff;
    padding: 14px 20px; display: flex;
    align-items: center; gap: 12px;
  }
  .chat-header h3 { font-size: 16px; font-weight: 600; }
  .chat-header .status {
    width: 8px; height: 8px; background: #4ade80;
    border-radius: 50%; margin-left: auto;
  }

  .lang-bar {
    display: flex; gap: 8px; padding: 8px 16px;
    background: #f0f0eb; border-bottom: 1px solid #e5e5e0;
    align-items: center;
  }
  .lang-bar label { font-size: 12px; color: #666; }
  .lang-btn {
    border: 1px solid #ccc; background: #fff;
    border-radius: 4px; padding: 4px 8px;
    font-size: 13px; cursor: pointer;
  }
  .lang-btn.active { background: #2d5016; color: #fff; border-color: #2d5016; }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 12px 16px;
    border-radius: 12px; font-size: 14px; line-height: 1.5;
  }
  .msg.user { align-self: flex-end; background: #2d5016; color: #fff; }
  .msg.bot { align-self: flex-start; background: #f0f0eb; color: #333; }
  .msg.bot .sources {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed #ccc;
    font-size: 12px; color: #888; font-style: italic;
  }
  .msg.loading { background: #f0f0eb; color: #888; font-style: italic; }

  .chat-footer {
    padding: 12px 16px;
    border-top: 1px solid #e5e5e0;
  }
  .input-wrap {
    display: flex; gap: 8px; align-items: center;
    border: 1px solid #d5d5d0; border-radius: 20px;
    padding: 4px 4px 4px 14px;
  }
  .input-wrap input {
    flex: 1; border: none; outline: none;
    font-size: 14px; background: transparent;
  }
  .input-wrap button {
    width: 40px; height: 40px;
    border: none; border-radius: 50%;
    background: #2d5016; color: #fff;
    cursor: pointer;
  }
  .input-wrap button:disabled { background: #999; cursor: not-allowed; }

  .counter {
    text-align: right; font-size: 11px; margin-top: 4px;
    color: #999;
  }
  .counter.warn { color: #e67e22; }
  .counter.danger { color: #c0392b; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 10px;
    margin-bottom: 8px; letter-spacing: 0.3px;
  }
  .badge-cookbook { background: #e8f5e9; color: #2d5016; border: 1px solid #a5d6a7; }
  .badge-creative { background: #fff8e1; color: #8d6e00; border: 1px solid #ffe082; }

  .examples {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 16px; background: #fafaf8;
    border-bottom: 1px solid #e5e5e0;
  }
  .example-chip {
    background: #fff; border: 1px solid #ddd;
    border-radius: 12px; padding: 4px 10px;
    font-size: 12px; cursor: pointer; color: #2d5016;
  }
  .example-chip:hover { background: #f0f0eb; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>🍝 LegumAI</h1>
  <p id="chatbot-subtitle">Assistente Culinario del blog <a href="index.html">Leguminando</a></p>
  <p id="chatbot-version" style="font-size:0.9em;opacity:0.8;margin-top:4px;">Versione 1.0 - in prova</p>
  <a href="index.html" id="chatbot-home" style="display:inline-block;margin-top:12px;padding:8px 18px;background:rgba(255,255,255,0.2);border:2px solid white;border-radius:25px;color:white;text-decoration:none;font-size:0.95em;transition:all 0.3s;">← Torna alla Home</a>
</div>

<div class="chat-wrap">
  <div class="chat-card">
    <div class="chat-header">
      <span>🤖</span>
      <h3>LegumAI</h3>
      <span class="status" title="Online"></span>
    </div>

    <div class="lang-bar">
      <label>Lingua:</label>
      <button class="lang-btn active" data-lang="it" onclick="setLang(this)">🇮🇹 IT</button>
      <button class="lang-btn" data-lang="en" onclick="setLang(this)">🇬🇧 EN</button>
      <button class="lang-btn" data-lang="es" onclick="setLang(this)">🇪🇸 ES</button>
      <button class="lang-btn" data-lang="pt" onclick="setLang(this)">🇵🇹 PT</button>
      <button class="lang-btn" data-lang="de" onclick="setLang(this)">🇩🇪 DE</button>
      <button class="lang-btn" data-lang="el" onclick="setLang(this)">🇬🇷 EL</button>
    </div>

    <div class="examples" id="examples">
      <span class="example-chip" onclick="fillAndSend('pasta e fagioli')">pasta e fagioli</span>
      <span class="example-chip" onclick="fillAndSend('ribollita')">ribollita</span>
      <span class="example-chip" onclick="fillAndSend('minestrone')">minestrone</span>
      <span class="example-chip" onclick="fillAndSend('crea una ricetta con ceci')">crea con ceci</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg bot">
        Ciao! Sono LegumAI, il tuo assistente culinario. Chiedimi una ricetta italiana o dimmi che ingredienti hai! 🇮🇹
      </div>
    </div>

    <div class="chat-footer">
      <div class="input-wrap">
        <input type="text" id="chatInput" placeholder="Dammi la ricetta della carbonara..." maxlength="80" onkeypress="if(event.key==='Enter') sendMessage()" oninput="updateCounter()">
        <button id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="counter" id="charCounter">0 / 80</div>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = 'https://pippomike791.pythonanywhere.com/chat';
let currentLang = 'it';

const UI = {
  it: {
    labelLang: "Lingua:",
    welcome: "Ciao! Sono LegumAI, il tuo assistente culinario. Chiedimi una ricetta italiana o dimmi che ingredienti hai! 🇮🇹",
    placeholder: "Dammi la ricetta della carbonara...",
    examples: ["pasta e fagioli", "ribollita", "minestrone", "crea con ceci"],
    badgeCookbook: "🍳 Dal ricettario",
    badgeCreative: "✨ Proposta di LegumAI",
    error: "Errore di connessione. Riprova piu' tardi.",
    counter: "0 / 80",
    loading: "Sto cercando la ricetta...",
    subtitle: "Assistente Culinario del blog",
    version: "Versione 1.0 - in prova",
    home: "← Torna alla Home"
  },
  en: {
    labelLang: "Language:",
    welcome: "Hello! I'm LegumAI, your culinary assistant. Ask me an Italian recipe or tell me what ingredients you have! 🇬🇧",
    placeholder: "Give me the carbonara recipe...",
    examples: ["pasta e fagioli", "ribollita", "minestrone", "create with chickpeas"],
    badgeCookbook: "🍳 From the cookbook",
    badgeCreative: "✨ LegumAI suggestion",
    error: "Connection error. Please try again later.",
    counter: "0 / 80",
    loading: "Searching the recipe...",
    subtitle: "Culinary Assistant of the",
    version: "Version 1.0 - beta",
    home: "← Back to Home"
  },
  es: {
    labelLang: "Idioma:",
    welcome: "Hola! Soy LegumAI, tu asistente culinario. Pideme una receta italiana o dime que ingredientes tienes! 🇪🇸",
    placeholder: "Dame la receta de la carbonara...",
    examples: ["pasta e fagioli", "ribollita", "minestrone", "crea con garbanzos"],
    badgeCookbook: "🍳 Del recetario",
    badgeCreative: "✨ Propuesta de LegumAI",
    error: "Error de conexion. Intenta mas tarde.",
    counter: "0 / 80",
    loading: "Buscando la receta...",
    subtitle: "Asistente Culinario del",
    version: "Versión 1.0 - en prueba",
    home: "← Volver al Inicio"
  },
  pt: {
    labelLang: "Idioma:",
    welcome: "Ola! Sou LegumAI, seu assistente culinario. Peca-me uma receita italiana ou diga-me que ingredientes tem! 🇵🇹",
    placeholder: "Diga-me a receita da carbonara...",
    examples: ["pasta e fagioli", "ribollita", "minestrone", "crie com grao-de-bico"],
    badgeCookbook: "🍳 Do livro de receitas",
    badgeCreative: "✨ Sugestao de LegumAI",
    error: "Erro de conexao. Tente novamente mais tarde.",
    counter: "0 / 80",
    loading: "Procurando a receita...",
    subtitle: "Assistente Culinário do",
    version: "Versão 1.0 - em teste",
    home: "← Voltar ao Início"
  },
  de: {
    labelLang: "Sprache:",
    welcome: "Hallo! Ich bin LegumAI, Ihr kulinarischer Assistent. Fragen Sie mich nach einem italienischen Rezept oder sagen Sie mir, welche Zutaten Sie haben! 🇩🇪",
    placeholder: "Gib mir das Carbonara-Rezept...",
    examples: ["pasta e fagioli", "ribollita", "minestrone", "mit Kichererbsen kreieren"],
    badgeCookbook: "🍳 Aus dem Kochbuch",
    badgeCreative: "✨ LegumAI-Vorschlag",
    error: "Verbindungsfehler. Bitte versuchen Sie es spaeter erneut.",
    counter: "0 / 80",
    loading: "Rezept wird gesucht...",
    subtitle: "Küchenassistent des",
    version: "Version 1.0 - im Test",
    home: "← Zurück zur Startseite"
  },
  el: {
    labelLang: "Γλώσσα:",
    welcome: "Γεια σας! Είμαι ο LegumAI, ο γευσιγνωστικός σας βοηθός. Ζητήστε μου μια ιταλική συνταγή ή πείτε μου τι υλικά έχετε! 🇬🇷",
    placeholder: "Δώσε μου τη συνταγή για καρμπονάρα...",
    examples: ["pasta e fagioli", "ribollita", "minestrone", "δημιούργησε με ρεβίθια"],
    badgeCookbook: "🍳 Από το βιβλίο συνταγών",
    badgeCreative: "✨ Πρόταση LegumAI",
    error: "Σφάλμα σύνδεσης. Δοκιμάστε ξανά αργότερα.",
    counter: "0 / 80",
    loading: "Αναζήτηση συνταγής...",
    subtitle: "Μαγειρικός Βοηθός του",
    version: "Έκδοση 1.0 - σε δοκιμή",
    home: "← Επιστροφή στην Αρχική"
  }
};

function setLang(btn) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLang = btn.dataset.lang;
  applyUILang();
}

function applyUILang() {
  const t = UI[currentLang];
  // Label Lingua
  const label = document.querySelector('.lang-bar label');
  if (label) label.textContent = t.labelLang;
  // Welcome message (primo msg bot)
  const msgs = document.querySelectorAll('.chat-messages .msg.bot');
  if (msgs.length > 0) {
    msgs[0].textContent = t.welcome;
  }
  // Placeholder
  document.getElementById('chatInput').placeholder = t.placeholder;
  // Esempi
  const chips = document.querySelectorAll('.example-chip');
  chips.forEach((chip, i) => {
    if (t.examples[i]) {
      chip.textContent = t.examples[i];
      chip.setAttribute('onclick', `fillAndSend('${t.examples[i]}')`);
    }
  });
  // Subtitle e versione nella top-bar
  const sub = document.getElementById('chatbot-subtitle');
  if (sub) sub.innerHTML = t.subtitle + ' <a href="index.html">Leguminando</a>';
  const ver = document.getElementById('chatbot-version');
  if (ver) ver.textContent = t.version;
  const home = document.getElementById('chatbot-home');
  if (home) home.textContent = t.home;
  // Contatore
  updateCounter();
}

function updateCounter() {
  const input = document.getElementById('chatInput');
  const counter = document.getElementById('charCounter');
  const len = input.value.length;
  counter.textContent = len + ' / 80';
  counter.className = 'counter' + (len > 75 ? ' danger' : len > 60 ? ' warn' : '');
}

function fillAndSend(text) {
  document.getElementById('chatInput').value = text;
  updateCounter();
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const messages = document.getElementById('chatMessages');
  const text = input.value.trim();

  if (!text) return;
  if (text.length > 80) return;

  messages.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
  input.value = '';
  updateCounter();
  btn.disabled = true;

  const t = UI[currentLang];
  const loadingId = 'loading-' + Date.now();
  messages.innerHTML += `<div class="msg loading" id="${loadingId}">${t.loading}</div>`;
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, lang: currentLang })
    });

    const data = await res.json();
    document.getElementById(loadingId).remove();

    if (data.error) {
      messages.innerHTML += `<div class="msg bot"><strong>Errore:</strong> ${escapeHtml(data.error)}</div>`;
    } else {
      let html = `<div class="msg bot">`;
      if (data.mode === 'cookbook') {
        html += `<div class="badge badge-cookbook">${t.badgeCookbook}</div>`;
      } else if (data.mode === 'creative' || data.mode === 'creative_soft') {
        html += `<div class="badge badge-creative">${t.badgeCreative}</div>`;
      }
      html += formatResponse(data.reply);
      if (data.sources && data.sources.length > 0) {
        const uniqueSources = [...new Set(data.sources)];
        html += `<div class="sources">📖 Fonti: ${uniqueSources.map(escapeHtml).join(", ")}</div>`;
      }
      html += `</div>`;
      messages.innerHTML += html;
    }
  } catch (err) {
    document.getElementById(loadingId).remove();
    messages.innerHTML += `<div class="msg bot"><strong>${t.error}</strong></div>`;
  }

  btn.disabled = false;
  messages.scrollTop = messages.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatResponse(text) {
  return text
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^#+\s+(.+)$/gm, '<h4>$1</h4>');
}

// Applica lingua all'avvio (default IT)
document.addEventListener('DOMContentLoaded', applyUILang);
</script>

</body>
</html>
